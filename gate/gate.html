<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARPSITE // Approaching Warp Gate</title>
    <style>
        body { 
            background: #020205; 
            color: #ff0055; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            position: relative;
        }
        .starfield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            z-index: 1;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            animation: warpMove 15s linear infinite;
        }
        @keyframes warpMove {
            from { background-position: 0 0, 40px 60px, 130px 270px; }
            to { background-position: -550px 550px, -310px 410px, -120px 520px; }
        }
        .gate-panel { 
            border: 2px solid #ff0055; 
            background: rgba(15, 5, 17, 0.9); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.35); 
            width: 450px; 
            text-align: center; 
            box-sizing: border-box; 
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        .brand-header { font-size: 1.2rem; color: #fff; font-weight: bold; letter-spacing: 4px; margin-bottom: 5px; text-shadow: 0 0 8px #ff0055; }
        .system-status { color: #ff9900; font-size: 0.8rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .timer-display { font-size: 3rem; font-weight: bold; color: #ff0055; text-shadow: 0 0 15px #ff0055; margin: 20px 0; }
        .ad-simulation { border: 1px solid #444; background: #111; color: #888; padding: 20px; margin: 20px 0; font-size: 0.8rem; text-transform: uppercase; }
        .btn-launch { background: #00ff55; color: #000; border: none; padding: 15px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; display: none; width: 100%; box-shadow: 0 0 15px #00ff55; font-family: inherit; }
        .btn-launch:hover { background: #fff; box-shadow: 0 0 20px #fff; }
    </style>
</head>
<body>
    <div class="starfield"></div>
    <div class="gate-panel">
        <div class="brand-header">WARPSITE DETECTOR</div>
        <div class="system-status" id="statusMessage">🚨 Warning: Entering High-Velocity Jump Sector</div>
        <h2 id="actionTitle">Charging Hyperdrive Generators</h2>
        <p id="subTitle">Securing structural deflector shields...</p>
        <div class="timer-display" id="countdown">10</div>
        <div class="ad-simulation">
            🪐 Space-Ad Broadcast: Buy fuel rods at Nebula-5 for 20% off!
        </div>
        <button id="launchBtn" class="btn-launch">⚡ Initiate Hyperjump</button>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const encodedVector = urlParams.get('vector');
        if (!encodedVector) {
            document.getElementById('statusMessage').innerText = "❌ WARPSITE CORE ERROR";
            document.getElementById('actionTitle').innerText = "Coordinates Missing";
            document.getElementById('subTitle').innerText = "The navigation array found no hyperjump vectors.";
            document.getElementById('countdown').style.display = 'none';
        } else {
            let chargeTime = 10;
            const countdownEl = document.getElementById('countdown');
            const launchBtn = document.getElementById('launchBtn');
            const hyperdriveCycle = setInterval(() => {
                chargeTime--;
                countdownEl.textContent = chargeTime;
                if (chargeTime <= 0) {
                    clearInterval(hyperdriveCycle);
                    countdownEl.style.display = 'none';
                    launchBtn.style.display = 'block';
                }
            }, 1000);
            launchBtn.addEventListener('click', () => {
                launchBtn.innerText = "WARPING...";
                launchBtn.disabled = true;
                try {
                    const destination = atob(encodedVector);
                    window.location.href = destination;
                } catch (e) {
                    alert("Warp drive coordinate degradation. Recalibration required.");
                    launchBtn.innerText = "Initiate Hyperjump";
                    launchBtn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
